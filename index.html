function poseOf(s){const [m,...kv]=s.split(/ (?=[a-z]\d?=)/),n=m.split(" ").map(Number),P={h:[n[0],n[1]],s:[n[2],n[3]],e:[n[4],n[5]],w:[n[6],n[7]],p:[n[8],n[9]],k:[n[10],n[11]],a:[n[12],n[13]]};
 kv.forEach(t=>{const [k,v]=t.split("=");P[k]=k==="c"?+v:v.split(",").map(Number)});return P}
function howSVG(d,str){const P=poseOf(str),L=(a,b,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,
 TX="var(--tx)",MU="var(--mu)",AC="var(--ac)";let g=`<line x1="4" y1="101" x2="116" y2="101" stroke="#333" stroke-width="1.5"/>`;
 (d.p||[]).forEach(q=>g+=q[0]==="r"?`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="1.5" fill="var(--card2)" stroke="${MU}" stroke-width="1.5"/>`:L([q[1],q[2]],[q[3],q[4]],MU,2.5));
 const hand=P.n||P.w,M=(p,c)=>[2*c-p[0],p[1]],c=P.c||60;
 if(d.cab)g+=L(d.cab,P.w,AC,1.2)+`<circle cx="${d.cab[0]}" cy="${d.cab[1]}" r="2.5" fill="none" stroke="${MU}" stroke-width="1.5"/>`;
 if(d.band)g+=`<path d="M${d.band[0]} ${d.band[1]} L${P.w[0]} ${P.w[1]}" stroke="${AC}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
 const limbs=(s,e,w,p,k,a,o)=>L(s,e,TX,3*o)+L(e,w,TX,3*o)+L(p,k,TX,3.4*o)+L(k,a,TX,3.4*o);
 if(d.front){const sL=M(P.s,c),pL=M(P.p,c);g+=L(P.s,sL,TX,3)+L([c,P.s[1]],[c,P.p[1]],TX,3.6)+L(P.p,pL,TX,3)+L([c,P.s[1]],P.h,TX,3)+
  limbs(P.s,P.e,P.w,P.p,P.k,P.a,1)+limbs(sL,P.e2||M(P.e,c),P.w2||M(P.w,c),pL,P.k2||M(P.k,c),P.a2||M(P.a,c),1);
  if(d.t==="db")[P.w,P.w2||M(P.w,c)].forEach(q=>g+=`<rect x="${q[0]-4}" y="${q[1]-2}" width="8" height="4" rx="1" fill="${AC}"/>`)}
 else{if(P.k2)g+=L(P.p,P.k2,TX,2.4)+L(P.k2,P.a2,TX,2.4);if(P.e2)g+=L(P.s,P.e2,TX,2.2)+L(P.e2,P.w2,TX,2.2);
  g+=L(P.s,P.p,TX,3.6)+limbs(P.s,P.e,P.w,P.p,P.k,P.a,1);if(P.n)g+=L(P.w,P.n,TX,2.5);
  if(d.t==="bar")g+=L([hand[0]-16,hand[1]],[hand[0]+14,hand[1]],AC,3);
  if(d.t==="db")g+=`<rect x="${hand[0]-3.5}" y="${hand[1]-3.5}" width="7" height="7" rx="1.5" fill="${AC}"/>`;
  if(d.t==="grip")g+=`<circle cx="${hand[0]}" cy="${hand[1]}" r="2.6" fill="${AC}"/>`}
 if(d.ft==="plate")g+=L([P.a[0]+3,P.a[1]-14],[P.a[0]+3,P.a[1]+12],AC,3);
 if(d.ft==="pad")g+=`<circle cx="${P.a[0]}" cy="${P.a[1]}" r="3.5" fill="${AC}"/>`;
 g+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="6.5" fill="var(--bg)" stroke="${TX}" stroke-width="3"/>`;
 return `<svg viewBox="0 0 120 106" role="img">${g}</svg>`}

const nrm=v=>String(v||"").toLowerCase().replace(/^[a-z]{3}\s*[·\-:]\s*/,"").trim();
function tipTpl(name){const T=coachTips&&coachTips.templates;if(!T||!name)return null;if(T[name]&&typeof T[name]==="object")return T[name];const k=Object.keys(T).find(k=>k.toLowerCase()===String(name).toLowerCase())||Object.keys(T).find(k=>nrm(k)===nrm(name));return k&&typeof T[k]==="object"?T[k]:null}

 <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="rpa" checked style="width:24px;min-height:24px"> Apply to all sets of this exercise</label><button class="p w" id="rpOk">Done</button>`);

  if(restAt&&restAt[0]===i&&restAt[1]===j&&restEnd){restTot=v*1000;restEnd=v?Date.now()+restTot:0}

function finishWorkout(auto){const a=active;
 const ex=a.ex.map(e=>{const x=exById(e.exId)||{};return{exId:e.exId,name:x.name||e.name||e.exId,rehab:!!x.rehab,group:a.group,sets:e.sets.filter(s=>s.done||s.w!==""||s.r!=="").map(s=>({w:s.w===""||s.w==null?null:+s.w,r:s.r===""||s.r==null?null:+s.r,done:!!s.done,...(s.type?{type:s.type}:{})})),...((e.note||"").trim()?{note:e.note.trim()}:{})}}).filter(e=>e.sets.length||e.note);
 if(auto&&!ex.length){active=null;saveActive();restEnd=0;$("#aw").classList.add("hid");toast("Idle workout discarded (no sets logged)");return}
 if(!auto&&!ex.length&&!confirm("No sets logged. Save anyway?"))return;
 const old=a.id?sessions.find(s=>s.id===a.id):null;
 const s={id:a.id||uid(),date:a.date,dow:parse(a.date).getDay(),day:a.name,group:a.group,week:weekOf(a.date),ex,armPain:a.armPain,kneePain:a.kneePain,notes:a.notes,saved:new Date().toISOString(),dur:old?old.dur:Math.max(0,(auto?(a.lastAct||a.start):Date.now())-a.start)};
 if(old)sessions=sessions.map(x=>x.id===s.id?s:x);else sessions.push(s);
 save();playCue("wFinish");active=null;saveActive();restEnd=0;$("#aw").classList.add("hid");toast(auto?"Workout auto-finished after 30 min idle":old?"Saved ✓":"Workout complete 💪");show("history");if(LS.get("gym.askCoach",true))askCoach(s)}

// ---- Send to Coach ----
const COACH="arwin-gym@mail.grokbot.com";
function lastTime(s,e){const p=sessions.filter(h=>h.id!==s.id&&(h.date<s.date||h.date===s.date&&String(h.saved)<String(s.saved))&&h.ex.some(x=>x.exId===e.exId)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.saved).localeCompare(String(a.saved)))[0];if(!p)return"";const x=p.ex.find(x=>x.exId===e.exId);return`  Last time (${dmy(p.date)}): ${x.sets.map(t=>`${isBW(e.exId)?wOut(e.exId,t.w).replace(" kg",""):(t.w??"–")}x${rOut(e.exId,t.r)}`).join(", ")}`}
function coachText(s,onlyDone,noLast){const L=[`Date: ${DAYS[s.dow]} ${dmy(s.date)}`,`Duration: ${s.dur?fmtT(s.dur):"–"}`,`Total volume: ${Math.round(vol(s)).toLocaleString()} kg`,...(onlyDone?["(completed sets only)"]:[]),""];
 s.ex.forEach(e=>{const st=e.sets.map((t,i)=>[t,i]).filter(([t])=>!onlyDone||t.done!==false);if(onlyDone&&!st.length)return;L.push(exName(e.exId,e.name));const lt=noLast?"":lastTime(s,e);if(lt)L.push(lt);
  st.forEach(([t,i])=>L.push(`  ${i+1}. ${t.type||"Normal"} ${wOut(e.exId,t.w)} x ${rOut(e.exId,t.r)} ${t.done===false?"[not ticked]":t.done?"[ticked]":"[logged]"}`));if(e.note)L.push(`  Note: ${e.note.replace(/\s*\n\s*/g," / ")}`)});
 L.push("",`Arm pain: ${s.armPain}/10`,`Knee pain: ${s.kneePain}/10`,`Notes: ${s.notes||"–"}`);return L.join("\n")}
function coachURL(s){const sub=`Workout: ${s.day} ${dmy(s.date)}`,mk=b=>`mailto:${COACH}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(b)}`;let u=mk(coachText(s,false));
 if(u.length>1800)u=mk(coachText(s,false,true));
 if(u.length>1800){u=mk(coachText(s,true,true));if(u.length>1800){let b=coachText(s,true,true);while(b.length&&mk(b+"\n…").length>1800)b=b.slice(0,-20);u=mk(b+"\n…")}}return u}
function sendCoach(s){location.href=coachURL(s)}
function askCoach(s){const sh=openSheet("Send to Coach?",`<div class="mu" style="margin-bottom:10px">Email this workout to your coach (${COACH}).</div><button class="p w" id="cqY">📧 Send to Coach</button><button class="ghost w" id="cqN">Not now</button>`);
 sh.querySelector("#cqY").onclick=()=>{sendCoach(s);sh.remove()};sh.querySelector("#cqN").onclick=()=>sh.remove()}

function renderHistory(){
 const list=[...sessions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.saved).localeCompare(String(a.saved)));
 if(!list.length){$("#v-history").innerHTML='<div class="card mu">No workouts yet. Start one from the Workout tab.</div>';return}
 $("#v-history").innerHTML=`<div class="mu">${list.length} workouts</div>`+list.map(s=>`<div class="card"><div class="rowb"><b>${esc(s.day)}</b><span class="mu">${DAYS[s.dow]} ${dmy(s.date)}</span></div>
 <div class="mu">${s.dur?"⏱ "+fmtT(s.dur)+" · ":""}🏋️ ${Math.round(vol(s)).toLocaleString()} kg · Arm ${s.armPain}/10 · Knee ${s.kneePain}/10</div>
 <table style="margin-top:6px"><tr><th>Exercise</th><th>Best set</th></tr>${s.ex.map(e=>{const b=[...e.sets].sort(isTimed(e.exId)||isBW(e.exId)?(x,y)=>(y.r||0)-(x.r||0)||(y.w||0)-(x.w||0):(x,y)=>(y.w||0)*(y.r||0)-(x.w||0)*(x.r||0)||(y.r||0)-(x.r||0))[0]||{};return`<tr><td>${e.sets.length} × ${esc(exName(e.exId,e.name))}${e.sets.some(t=>t.type)?`<div class="mu" style="font-size:12px">${e.sets.map(tBadge).join(" ")}</div>`:""}${e.note?`<div class="mu" style="font-size:12px;white-space:pre-wrap">📝 ${esc(e.note)}</div>`:""}</td><td>${wOut(e.exId,b.w)} × ${rOut(e.exId,b.r)}</td></tr>`}).join("")}</table>
 ${s.notes?`<div class="mu">📝 ${esc(s.notes)}</div>`:""}<div class="row" style="margin-top:8px"><button class="ghost" data-e="${s.id}">✏️ Edit</button><button class="ghost" data-cs="${s.id}">📧 Send to Coach</button><button class="d" data-x="${s.id}">🗑 Delete</button></div></div>`).join("");
 $("#v-history").querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>sendCoach(sessions.find(x=>x.id===b.dataset.cs)));
 $("#v-history").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editSession(b.dataset.e));
 $("#v-history").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Delete this workout?")){sessions=sessions.filter(s=>s.id!==b.dataset.x);save();renderHistory()}});
}
function editSession(id){const s=sessions.find(x=>x.id===id);if(active&&!confirm("Discard the workout in progress?"))return;
 active={id:s.id,start:Date.now(),date:s.date,tplId:null,name:s.day,dow:s.dow,group:s.group,note:"",ex:s.ex.map(e=>({exId:e.exId,name:e.name,target:"",sets:e.sets.map(t=>({w:t.w??"",r:t.r??"",done:true,...(t.type?{type:t.type}:{})})),note:e.note||""})),armPain:s.armPain,kneePain:s.kneePain,notes:s.notes||""};saveActive();renderActive()}

const REAL=new Set(["arm-rehab-band-bicep-curl", "bird-dog", "calf-raise", "chest-press-machine", "chest-supported-row", "face-pull", "glute-bridge", "goblet-squat", "heel-to-toe-walk", "incline-db-press", "incline-push-up", "inverted-row", "lat-pulldown", "lateral-raise", "leg-curl", "leg-press", "pec-deck-cable-fly", "plank", "romanian-deadlift", "seated-cable-row", "seated-leg-extension", "shoulder-press-machine", "side-plank", "single-leg-stand", "slow-low-step-ups", "weight-shifts"]),VID=new Set(["arm-rehab-band-bicep-curl", "bird-dog", "chest-press-machine", "chest-supported-row", "face-pull", "glute-bridge", "goblet-squat", "heel-to-toe-walk", "incline-db-press", "incline-push-up", "inverted-row", "lat-pulldown", "lateral-raise", "leg-curl", "leg-press", "pec-deck-cable-fly", "romanian-deadlift", "seated-cable-row", "seated-leg-extension", "shoulder-press-machine", "side-plank", "single-leg-stand", "slow-low-step-ups", "weight-shifts"]);
function realHTML(x){const k=x.pose&&slug(x.pose);if(!k||!REAL.has(k))return"";return`<div class="rv" data-rv="${k}"><img class="r0" loading="lazy" decoding="async" src="img/${k}-a.webp" alt="${esc(x.name)} start position"><img class="r1" loading="lazy" decoding="async" src="img/${k}-b.webp" alt="${esc(x.name)} end position"><video class="hid" muted loop playsinline preload="none"></video><span class="rvl">START</span><button class="rvp" aria-label="Play animation">▶</button></div>`}
document.addEventListener("click",e=>{const b=e.target.closest(".rvp,.rv");if(!b)return;const r=b.closest(".rv");if(r)rvToggle(r)});
function rvToggle(r){const k=r.dataset.rv,v=r.querySelector("video"),btn=r.querySelector(".rvp"),l=r.querySelector(".rvl");
 if(r._on){r._on=false;clearInterval(r._t);v.pause();btn.textContent="▶";btn.setAttribute("aria-label","Play animation");return}
 r._on=true;btn.textContent="❚❚";btn.setAttribute("aria-label","Pause animation");
 if(VID.has(k)&&!r._vfail){if(!v.src){v.src="vid/"+k+".mp4";v.onerror=()=>{r._vfail=1;v.classList.add("hid");r._on=false;rvToggle(r)}}v.classList.remove("hid");l.classList.add("hid");v.play().catch(()=>{r._vfail=1;v.classList.add("hid");r._on=false;rvToggle(r)});return}
 let end=r.classList.contains("end");const step=()=>{if(!r.isConnected)return clearInterval(r._t);end=!end;r.classList.toggle("end",end);l.textContent=end?"END":"START"};step();r._t=setInterval(step,1200)}

const STEPS={
"chest-press-machine":["Set the seat so the handles line up with the middle of your chest.","Sit tall with your back and head against the pad, feet flat on the floor.","Grip the handles, shoulders down and back, elbows slightly below shoulder height.","Breathe out and press the handles forward until your arms are nearly straight — don't lock the elbows.","Pause briefly, then let the handles return slowly (about 2–3 seconds) until you feel a light chest stretch."],
"incline-db-press":["Set the bench to about 30° and sit with a dumbbell on each thigh.","Lie back, kicking the dumbbells up to your chest, feet flat on the floor.","Hold the dumbbells beside your upper chest, elbows about 45° from your body.","Press both dumbbells up and slightly together over your upper chest until arms are nearly straight.","Lower slowly back to the start, keeping your shoulder blades pinned to the bench."],
"pec-deck-cable-fly":["Adjust the seat so the handles are at chest height.","Sit tall with your back on the pad and grip the handles with a slight bend in the elbows.","Keeping that elbow bend fixed, squeeze your chest to bring the handles together in front of you.","Pause and squeeze for a second at the middle.","Open back out slowly until you feel a comfortable stretch — don't let your arms go behind your body."],
"arm-rehab-band-tricep-pushdown":["Anchor a light band above head height.","Stand facing the anchor, holding the band with elbows tucked at your sides and bent to about 90°.","Keep your upper arms still and push your hands down until your arms are straight.","Squeeze the back of the arm briefly at the bottom.","Let your hands rise slowly back to the start. Use light tension and stop on any sharp pain."],
"arm-rehab-wrist-curl-1-2kg":["Sit on a bench and rest your forearm on your thigh, palm facing up, wrist just past the knee.","Hold a 1–2 kg dumbbell and let the wrist bend down gently.","Curl the wrist up slowly, lifting the weight with your hand only.","Pause at the top for a second.","Lower slowly over 3 seconds. Keep it pain-free and stop on any sharp pain."],
"goblet-squat":["Hold one dumbbell vertically against your chest with both hands.","Stand with feet shoulder width apart, toes turned out slightly.","Brace your core and sit your hips back and down, keeping your chest up.","Go only as deep as your knee stays pain-free; knees track over your toes.","Push through your whole foot to stand back up tall, squeezing your glutes at the top."],
"leg-press":["Sit back in the machine with your back and hips flat against the pad.","Place your feet shoulder width apart in the middle of the platform.","Release the safety handles and hold the side grips.","Lower the platform slowly by bending your knees, only as far as is pain-free for your knee and your lower back stays on the pad.","Push through your heels to extend your legs, stopping just short of locking your knees.","Re-engage the safety handles when you finish your set."],
"romanian-deadlift":["Stand tall holding the bar (or dumbbells) at your thighs, feet hip width apart.","Soften your knees slightly and keep them there.","Push your hips back, sliding the weight down your thighs with a flat back.","Lower until you feel a strong hamstring stretch, usually just below the knee.","Drive your hips forward to stand back up, squeezing your glutes at the top."],

"calf-raise":["Step under the shoulder pads and place the balls of your feet on the edge of the platform.","Stand tall with knees straight but not locked.","Let your heels drop slowly below the platform for a stretch.","Rise up as high as you can onto your toes.","Pause at the top for a second, then lower slowly."],
"lat-pulldown":["Adjust the thigh pad so your legs are locked in firmly.","Grip the bar a little wider than shoulder width, palms facing away.","Sit with a slight lean back and your chest up.","Pull the bar down to your upper chest by driving your elbows down toward your ribs.","Squeeze your back, then let the bar rise slowly until your arms are straight."],

"arm-rehab-band-bicep-curl":["Stand on the middle of a light band, holding the ends with palms facing forward.","Keep your elbows tucked at your sides.","Curl your hands up toward your shoulders slowly.","Pause briefly at the top.","Lower slowly over 3 seconds. Keep it light and stop on any sharp pain."],

function swTarget(e){const t=tipEx(exName(e.exId,e.name),active&&(active.tplName||active.name));const src=[t&&t.target,e.target];
 for(const v of src){if(v==null)continue;const str=String(v);let m=str.match(/(\d+):(\d{2})/);if(m)return +m[1]*60+ +m[2];m=str.match(/(\d+)(?:\s*[-–]\s*(\d+))?\s*(?:s|sec|secs|seconds)\b/i);if(m)return +(m[2]||m[1]);m=str.match(/(\d+)\s*(?:min|mins|minutes)\b/i);if(m)return +m[1]*60}return 0}
function stopwatch(i,j){const e=active.ex[i],set=e.sets[j];if(!e||!set)return;const tg=swTarget(e);let acc=0,from=0,cdEnd=0,iv=null,wl=null,lastMin=0,tgHit=false,lastCd=0;
 const cdOn=LS.get("gym.swCd",true);
 const s=openSheet("⏱ "+exName(e.exId,e.name)+" · Set "+(j+1),`<div id="swS"><div class="swd" id="swD">0:00.0</div><div class="swi" id="swI">${tg?"Target "+fmtS(tg)+" · buzz at target":"Buzz every minute"}${restSound==="off"?" (sound off in Profile)":""}</div>
 <div class="swb"><button class="ok" id="swGo">Start</button><button class="ghost" id="swR">Reset</button></div><button class="p w" id="swDone" style="margin-top:10px;min-height:60px;font-size:20px">Done – use this time</button>
 <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="swC" ${cdOn?"checked":""} style="width:24px;min-height:24px"> 3-2-1 countdown before start</label></div>`);
 const D=s.querySelector("#swD"),go=s.querySelector("#swGo"),I=s.querySelector("#swI");
 const el=()=>acc+(from?Date.now()-from:0);
 const show=ms=>{const t=Math.floor(ms/100),sec=Math.floor(t/10);setTx(D,Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+"."+(t%10))};
 const lock=async()=>{try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(x){}};
 const unlock=()=>{try{wl&&wl.release()}catch(x){}wl=null};
 const loop=()=>{const now=Date.now();
  if(cdEnd){const left=cdEnd-now;if(left>0){const n=Math.ceil(left/1000);setTx(D,String(n));if(n!==lastCd){lastCd=n}return}cdEnd=0;D.classList.remove("cd");from=now;}
  if(!from)return;const ms=el();show(ms);
  if(tg){if(!tgHit&&ms>=tg*1000){tgHit=true;beep();setTx(I,"Target "+fmtS(tg)+" reached 💪")}}
  else{const mn=Math.floor(ms/60000);if(mn>lastMin){lastMin=mn;beep()}}};
 const setBtn=()=>{setTx(go,from||cdEnd?"Pause":acc?"Resume":"Start");go.className=from||cdEnd?"d":"ok"};
 const stop=()=>{if(from){acc+=Date.now()-from;from=0}cdEnd=0;D.classList.remove("cd");show(acc);setBtn()};
 go.onclick=()=>{unlockAudio();if(from||cdEnd){stop();unlock();return}
  lock();if(!iv)iv=setInterval(loop,100);
  if(!acc&&s.querySelector("#swC").checked){cdEnd=Date.now()+3000;lastCd=0;D.classList.add("cd");playCue("cd321")}else from=Date.now();setBtn();loop()};
 s.querySelector("#swR").onclick=()=>{from=0;cdEnd=0;acc=0;lastMin=0;tgHit=false;D.classList.remove("cd");show(0);setBtn();unlock();if(tg)setTx(I,"Target "+fmtS(tg)+" · buzz at target")};

 const onVis=()=>{if(!document.hidden&&(from||cdEnd)){lock();loop()}};document.addEventListener("visibilitychange",onVis);
 const close=()=>{clearInterval(iv);iv=null;unlock();document.removeEventListener("visibilitychange",onVis);s.remove()};
 s.querySelector("[data-close]").onclick=close;
 s.querySelector("#swDone").onclick=()=>{stop();const sec=Math.round(acc/1000);close();if(!sec)return;set.r=sec;saveActive();
  const row=document.querySelector(`#aw .st[data-i="${i}"][data-j="${j}"]`);if(!row){renderActive();return}const ir=row.querySelector(".ir");if(ir)ir.value=fmtS(sec);
  if(!set.done)row.querySelector(".ck").click();else toast("Time updated: "+fmtS(sec))};
 setBtn()}
function pickPhoto(cam){return new Promise(ok=>{/* one persistent input attached to <body>, outside any re-rendered DOM */
 if(!photoIn){photoIn=document.createElement("input");photoIn.type="file";photoIn.accept="image/*";photoIn.id="photoIn";photoIn.setAttribute("aria-hidden","true");photoIn.tabIndex=-1;photoIn.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";document.body.appendChild(photoIn)}
 const i=photoIn;i.value="";if(cam)i.setAttribute("capture","environment");else i.removeAttribute("capture");
 let done=false;const fin=f=>{if(done)return;done=true;i.onchange=null;i.oncancel=null;ok(f)};
 i.onchange=()=>fin(i.files[0]||null);i.oncancel=()=>fin(null);i.click()})}

const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const kg1=n=>(+n).toFixed(1);

function parseCSVText(text){text=String(text||"").replace(/^\uFEFF/,"");const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===","){row.push(cur);cur=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>String(x).trim()))rows.push(row);row=[]}
  else cur+=c}
 if(cur.length||row.length){row.push(cur);if(row.some(x=>String(x).trim()))rows.push(row)}
 return rows}
function normHead(h){return String(h||"").toLowerCase().replace(/[^a-z0-9]+/g,"")}
function numish(v){if(v==null)return null;const s=String(v).trim();if(!s||s==="--"||s==="-"||/^n\/?a$/i.test(s))return null;const n=parseFloat(s.replace(/,/g,""));return Number.isFinite(n)?n:null}

function parseTimeCell(s){s=String(s||"").trim();const m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return "";return ("0"+m[1]).slice(-2)+":"+m[2]+":"+(m[3]||"00")}
function detectWeightCSV(headers){const n=headers.map(normHead),has=k=>n.includes(k);
 if(has("recorded")&&has("date"))return "happyscale";
 if(has("date")&&(has("weightkg")||has("weight")||has("kg")||has("bodyweight")||has("recorded"))){
  if(has("time")&&(has("no")||has("bodyfatpercentage")||has("bmi")||has("visceralfat")))return "renpho";
  if(has("source")||has("bodyfatpercent")||has("musclemasskg"))return "merged";
  if(has("time"))return "renpho";
  return "generic"}
 return null}
function parseWeightCSV(text,name){const table=parseCSVText(text);if(!table.length)throw new Error((name||"File")+" is empty");
 const headers=table[0],type=detectWeightCSV(headers);if(!type)throw new Error((name||"File")+" isn't a RENPHO or Happy Scale weight export");
 const n=headers.map(normHead);const col=(...names)=>{for(const nm of names){const i=n.indexOf(nm);if(i>=0)return i}return -1};
 const iDate=col("date"),iTime=col("time"),iSrc=col("source");
 const iKg=col("weightkg","recorded","weight","kg","bodyweight");
 const iFat=col("bodyfatpercentage","bodyfatpercent","bodyfat","fat","fatpercent");
 const iMus=col("musclemasskg","musclemass","muscle");
 const out=[];
 for(let r=1;r<table.length;r++){const row=table[r],date=iDate>=0?isoDateCell(row[iDate]):null,kg=iKg>=0?numish(row[iKg]):null;
  if(!date||kg==null||kg<=0||kg>400)continue;
  let source=type==="happyscale"?"happyscale":(type==="renpho"?"renpho":"generic");
  if(iSrc>=0){const sv=normHead(row[iSrc]);if(sv==="renpho")source="renpho";else if(sv==="happyscale"||sv==="happyscaleexport"||sv==="happy")source="happyscale"}
  const rec={date,kg,source,file:name||""};
  if(iTime>=0)rec.time=parseTimeCell(row[iTime]);
  const fat=iFat>=0?numish(row[iFat]):null,mus=iMus>=0?numish(row[iMus]):null;
  if(fat!=null)rec.fat=fat;if(mus!=null)rec.muscle=mus;
  out.push(rec)}
 if(!out.length)throw new Error((name||"File")+" had no usable weigh-ins");
 return {type,rows:out}}
function mergeImportDays(rows){const by={};
 rows.filter(r=>r.source!=="renpho").forEach(r=>{if(!by[r.date])by[r.date]=r});
 const ren={};rows.filter(r=>r.source==="renpho").forEach(r=>{(ren[r.date]=ren[r.date]||[]).push(r)});
 Object.keys(ren).forEach(d=>{ren[d].sort((a,b)=>(a.time||"99:99:99").localeCompare(b.time||"99:99:99"));by[d]=ren[d][0]});
 return by}

async function importWeightFiles(fileList){const files=[...fileList].filter(Boolean);if(!files.length)return;

 for(const f of files){try{const text=await f.text();const {rows}=parseWeightCSV(text,f.name);rows.forEach(r=>all.push(r))}catch(e){errs.push(e.message||String(e))}}

 const rpDays=new Set(all.filter(r=>r.source==="renpho").map(r=>r.date));
 const overlap=[...hsDays].filter(d=>rpDays.has(d)).length;
 const have=new Set((weights||[]).map(w=>w.date));
 let added=0,skipped=0;const newOnes=[];
 dates.forEach(d=>{if(have.has(d)){skipped++;return}const r=merged[d],row={date:d,kg:+kg1(r.kg)};if(r.fat!=null)row.fat=r.fat;if(r.muscle!=null)row.muscle=r.muscle;newOnes.push(row);added++});
 if(newOnes.length){weights=weights.concat(newOnes).sort((a,b)=>a.date.localeCompare(b.date));save()}

 if(errs.length)bits.push("Issues: "+errs.join("; "));
 if(!added&&!skipped&&!errs.length)bits.push("No weigh-ins found.");
 const sh=openSheet("Import complete",`<div style="font-size:16px;line-height:1.5;margin-bottom:14px">${bits.map(esc).join("<br>")}</div><button class="p w" id="impDone">Done</button>`);

function weeklyRate(arr,i){const cur=arr[i];let best=null,bestDist=99;

function foodBarcode(meal,done){const s=openSheet("Barcode",`<div class="mu">Point the camera at the barcode, or type the number under it.</div><video id="fbV" playsinline muted style="width:100%;border-radius:12px;margin-top:10px;background:#111;display:none"></video><button class="ghost w" id="fbCam">📷 Use camera</button><div class="row" style="margin-top:10px"><input id="fbC" inputmode="numeric" placeholder="e.g. 9300633603232"><button class="p" id="fbG" style="flex:0 0 auto">Look up</button></div><div id="fbR" class="mu" style="margin-top:10px"></div>`);
 let stream=null,stop=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};const obs=new MutationObserver(()=>{if(!s.isConnected){stop();obs.disconnect()}});obs.observe(document.body,{childList:true});
 const look=async code=>{code=String(code).replace(/\D/g,"");if(code.length<6)return;$("#fbC").value=code;$("#fbR").textContent="Looking up "+code+"…";try{const j=await offGet("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,generic_name,brands,nutriments,serving_size,serving_quantity");
  if(j.status!==1||!j.product)throw new Error("not found");stop();foodServing(meal,offMap(j.product),()=>{s.remove();if(done)done()})}catch(e){$("#fbR").textContent=e.message==="not found"?"Product not in Open Food Facts. Use Quick add or create a custom food.":"Couldn't look up ("+(e.message==="offline"?"you're offline":e.message)+")."}};
 $("#fbG").onclick=()=>look($("#fbC").value);
 $("#fbCam").onclick=async()=>{if(!("BarcodeDetector"in window)){$("#fbR").textContent="Live barcode reading isn't supported in this browser (iPhone Safari). Type the number instead.";return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e){$("#fbR").textContent="Camera blocked.";return}
  const v=$("#fbV");v.style.display="block";v.srcObject=stream;await v.play();const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  const tick=async()=>{if(!stream)return;try{const b=await det.detect(v);if(b.length)return look(b[0].rawValue)}catch(e){}setTimeout(tick,300)};tick()}}
/* Photo scan: image is resized on the phone, sent to the app's own server (/food-scan), which calls the vision AI. No key in the browser. */
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.8))};im.onerror=()=>no(new Error("Couldn't read photo"));im.src=u})}
function foodScan(meal,done){const s=openSheet("Scan food",`<input type="file" id="fsF" accept="image/*" capture="environment" class="hid"><button class="p w" id="fsT">📷 Take photo</button><input id="fsH" placeholder="Optional note, e.g. 'large bowl, 2 eggs'" style="margin-top:10px"><img id="fsI" style="width:100%;border-radius:12px;margin-top:10px;display:none" alt=""><div id="fsR" class="mu" style="margin-top:10px">${FOOD_API?"Take a photo of your meal. The AI estimates each food. You check and edit before anything is added.":"Photo scanning needs the Gym Log server, which isn't set up yet. You can still take a photo, but nothing will be estimated."}</div><div id="fsL"></div>`);
 $("#fsT").onclick=()=>$("#fsF").click();
 $("#fsF").onchange=async()=>{const f=$("#fsF").files[0];if(!f)return;let img;try{img=await shrink(f)}catch(e){$("#fsR").textContent=e.message;return}$("#fsI").src=img;$("#fsI").style.display="block";
  if(!FOOD_API){$("#fsR").textContent="Scan server isn't set up yet, so I can't estimate this. Use search or Quick add.";return}
  $("#fsR").textContent="Analysing photo…";$("#fsL").innerHTML="";
  try{const r=await fetch(FOOD_API.replace(/\/$/,"")+"/food-scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img,hint:$("#fsH").value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"server "+r.status);
   const items=j.items||[];if(!items.length){$("#fsR").textContent="No food recognised. Try another angle or use search.";return}
   $("#fsR").textContent="Check and edit these estimates, untick anything wrong, then add.";
   $("#fsL").innerHTML=items.map((x,i)=>`<div class="card" data-si="${i}"><label style="display:flex;gap:10px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" checked style="width:24px;min-height:24px" data-k="on"><input data-k="name" value="${esc(x.name)}"></label><label>Portion<input data-k="serving" value="${esc(x.serving)}"></label><div class="row">${[["kcal","kcal"],["p","Protein g"],["f","Fat g"],["c","Carbs g"],["fib","Fibre g"]].map(([k,l])=>`<label>${l}<input data-k="${k}" type="number" inputmode="decimal" value="${x[k]??x.fibre??""}"></label>`).join("")}</div></div>`).join("")+`<div class="seg">${FMEALS.map(m=>`<button data-m="${m}" class="${m===meal?"on":""}">${m}</button>`).join("")}</div><button class="p w" id="fsA">Add to diary</button><div class="mu" style="margin-top:6px">AI estimates can be off by 20–30%. Adjust portions if needed.</div>`;
   let m=meal;s.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{m=b.dataset.m;s.querySelectorAll("[data-m]").forEach(y=>y.classList.toggle("on",y===b))});
   $("#fsA").onclick=()=>{let n=0;s.querySelectorAll("[data-si]").forEach(c=>{const v=k=>c.querySelector(`[data-k="${k}"]`);if(!v("on").checked)return;fPush(m,{name:v("name").value||"Food",serving:v("serving").value||"1 serve",kcal:v("kcal").value,p:v("p").value,c:v("c").value,f:v("f").value,fib:v("fib").value},1);n++});s.remove();if(done)done();toast(n+" item"+(n===1?"":"s")+" added ✓");renderFood()}}
  catch(e){$("#fsR").textContent="Scan failed ("+(navigator.onLine?e.message:"you're offline")+"). Use search or Quick add."}}}

</script></body></html>
