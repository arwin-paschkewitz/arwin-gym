function poseOf(s){const [m,...kv]=s.split(/ (?=[a-z]\d?=)/),n=m.split(" ").map(Number),P={h:[n[0],n[1]],s:[n[2],n[3]],e:[n[4],n[5]],w:[n[6],n[7]],p:[n[8],n[9]],k:[n[10],n[11]],a:[n[12],n[13]]};

function howSVG(d,str){const P=poseOf(str),L=(a,b,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,
 TX="var(--tx)",MU="var(--mu)",AC="var(--ac)";let g=`<line x1="4" y1="101" x2="116" y2="101" stroke="#333" stroke-width="1.5"/>`;
 (d.p||[]).forEach(q=>g+=q[0]==="r"?`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="1.5" fill="var(--card2)" stroke="${MU}" stroke-width="1.5"/>`:L([q[1],q[2]],[q[3],q[4]],MU,2.5));
 const hand=P.n||P.w,M=(p,c)=>[2*c-p[0],p[1]],c=P.c||60;
 if(d.cab)g+=L(d.cab,P.w,AC,1.2)+`<circle cx="${d.cab[0]}" cy="${d.cab[1]}" r="2.5" fill="none" stroke="${MU}" stroke-width="1.5"/>`;
 if(d.band)g+=`<path d="M${d.band[0]} ${d.band[1]} L${P.w[0]} ${P.w[1]}" stroke="${AC}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
 const limbs=(s,e,w,p,k,a,o)=>L(s,e,TX,3*o)+L(e,w,TX,3*o)+L(p,k,TX,3.4*o)+L(k,a,TX,3.4*o);
 if(d.front){const sL=M(P.s,c),pL=M(P.p,c);g+=L(P.s,sL,TX,3)+L([c,P.s[1]],[c,P.p[1]],TX,3.6)+L(P.p,pL,TX,3)+L([c,P.s[1]],P.h,TX,3)+
  limbs(P.s,P.e,P.w,P.p,P.k,P.a,1)+limbs(sL,P.e2||M(P.e,c),P.w2||M(P.w,c),pL,P.k2||M(P.k,c),P.a2||M(P.a,c),1);
  if(d.t==="db")[P.w,P.w2||M(P.w,c)].forEach(q=>g+=`<rect x="${q[0]-4}" y="${q[1]-2}" width="8" height="4" rx="1" fill="${AC}"/>`)}
 else{if(P.k2)g+=L(P.p,P.k2,TX,2.4)+L(P.k2,P.a2,TX,2.4);if(P.e2)g+=L(P.s,P.e2,TX,2.2)+L(P.e2,P.w2,TX,2.2);
  g+=L(P.s,P.p,TX,3.6)+limbs(P.s,P.e,P.w,P.p,P.k,P.a,1);if(P.n)g+=L(P.w,P.n,TX,2.5);
  if(d.t==="bar")g+=L([hand[0]-16,hand[1]],[hand[0]+14,hand[1]],AC,3);
  if(d.t==="db")g+=`<rect x="${hand[0]-3.5}" y="${hand[1]-3.5}" width="7" height="7" rx="1.5" fill="${AC}"/>`;
  if(d.t==="grip")g+=`<circle cx="${hand[0]}" cy="${hand[1]}" r="2.6" fill="${AC}"/>`}
 if(d.ft==="plate")g+=L([P.a[0]+3,P.a[1]-14],[P.a[0]+3,P.a[1]+12],AC,3);
 if(d.ft==="pad")g+=`<circle cx="${P.a[0]}" cy="${P.a[1]}" r="3.5" fill="${AC}"/>`;
 g+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="6.5" fill="var(--bg)" stroke="${TX}" stroke-width="3"/>`;
 return `<svg viewBox="0 0 120 106" role="img">${g}</svg>`}

function exDetail(id){const x=exById(id);if(!x)return toast("Exercise no longer in library");
 const hist=[...sessions].filter(s=>s.ex.some(e=>e.exId===id)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 const sec=(t,v)=>v?`<div class="lbl">${t}</div><div class="card" style="white-space:pre-wrap">${esc(v)}</div>`:"";
 const s=openSheet(x.name,`<div class="mu">${esc(x.group)}${x.rehab?" · rehab":""}</div>${howHTML(x)}${sec("INSTRUCTIONS",x.notes)}${sec("TIPS",x.tips)}${sec("SAFETY",x.safety)}
 <div class="lbl">HISTORY</div>${hist.length?hist.map(h=>{const e=h.ex.find(e=>e.exId===id);return`<div class="card"><b>${dmy(h.date)}</b> <span class="mu">${esc(h.day)}</span><div class="mu">${e.sets.map(t=>(t.w??"–")+" kg × "+(t.r??"–")).join(" · ")}</div></div>`}).join(""):'<div class="mu">Not logged yet.</div>'}`,'<button class="sm" id="xe">Edit</button>');
 s.querySelector("#xe").onclick=()=>{s.remove();exEdit(id)}}
function exEdit(id){const x=id?exById(id):{id:null,name:"",group:"Other",rehab:false,pose:"",notes:"",tips:"",safety:""};
 const poses=Object.keys(HOW).sort();
 const s=openSheet(id?"Edit exercise":"New exercise",`<label>Name<input id="fN" value="${esc(x.name)}" maxlength="60"></label>
 <label>Muscle group<select id="fG">${[...new Set([...GROUPS,x.group])].map(g=>`<option ${g===x.group?"selected":""}>${esc(g)}</option>`).join("")}</select></label>
 <label>Diagram<select id="fP"><option value="">No diagram</option>${poses.map(p=>`<option value="${esc(p)}" ${p===x.pose?"selected":""}>${esc(p)}</option>`).join("")}</select></label>
 <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="fR" ${x.rehab?"checked":""} style="width:24px;min-height:24px"> Rehab exercise (keep light)</label>
 <label>Instructions<textarea id="fI">${esc(x.notes)}</textarea></label><label>Tips<textarea id="fT">${esc(x.tips)}</textarea></label><label>Safety notes<textarea id="fS">${esc(x.safety)}</textarea></label>
 ${id?"":`<label>Add to template (day)<select id="fD"><option value="">Don't add</option>${tpl.map(t=>`<option value="${t.id}">${esc(tplLabel(t))}</option>`).join("")}</select></label><div class="row"><label>Sets<input type="number" id="fSe" value="3" inputmode="numeric"></label><label>Reps<input id="fRe" value="10"></label></div>`}
 <button class="p w" id="fSave">Save</button>${id?'<button class="d w" id="fDel">🗑 Delete exercise</button>':""}`);
 const q=k=>s.querySelector(k);
 q("#fSave").onclick=()=>{const n=q("#fN").value.trim();if(!n)return alert("Enter a name");if(lib.some(y=>y.id!==x.id&&y.name.toLowerCase()===n.toLowerCase()))return alert("An exercise with that name already exists");
  const o={name:n,group:q("#fG").value,pose:q("#fP").value,rehab:q("#fR").checked,notes:q("#fI").value,tips:q("#fT").value,safety:q("#fS").value};
  if(id)Object.assign(x,o);else{const nid=slug(n)+"-"+uid().slice(-4);lib.push(Object.assign({id:nid,def:0},o));const t=tpl.find(t=>t.id===q("#fD").value);if(t)t.items.push({exId:nid,sets:+q("#fSe").value||3,reps:q("#fRe").value||"10"})}
  saveLib();s.remove();toast("Saved ✓");if(!$("#aw").classList.contains("hid"))renderActive();show(view)};
 if(id)q("#fDel").onclick=()=>{if(!confirm("Delete "+x.name+"? It will be removed from all templates. Past logs are kept."))return;lib=lib.filter(y=>y.id!==id);tpl.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));saveLib();s.remove();toast("Deleted");show(view)}}
function pickExercise(cb){const s=openSheet("Add exercise",`<input type="search" id="pq" placeholder="🔍 Search"><div id="pl"></div>`);
 const draw=()=>{const q=s.querySelector("#pq").value.toLowerCase();s.querySelector("#pl").innerHTML=lib.filter(x=>!q||x.name.toLowerCase().includes(q)).map(x=>`<div class="li" data-p="${esc(x.id)}" role="button"><div class="ico">${esc(x.name[0])}</div><div><b>${esc(x.name)}</b><div class="mu">${esc(x.group)}</div></div><span style="color:var(--ac);font-size:24px">＋</span></div>`).join("");
  s.querySelectorAll("[data-p]").forEach(r=>r.onclick=()=>{s.remove();cb(r.dataset.p)})};
 s.querySelector("#pq").oninput=draw;draw()}

// ---- Template editor ----
function editTpl(id){const orig=id?tpl.find(t=>t.id===id):null;const t=orig?JSON.parse(JSON.stringify(orig)):{id:"t"+uid(),name:"New template",dow:"",group:"Other",note:"",items:[]};
 const s=openSheet(orig?"Edit template":"New template","",'<button class="ok" id="tS">Save</button>');const b=s.querySelector(".shb");
 const draw=()=>{b.innerHTML=`<label>Name<input id="tN" value="${esc(t.name)}"></label><div class="row"><label>Day<select id="tD"><option value="">Any day</option>${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${t.dow!==""&&t.dow==d?"selected":""}>${DAYS[d]}</option>`).join("")}</select></label><label>Group<select id="tG">${[...new Set([...GROUPS,t.group])].map(g=>`<option ${g===t.group?"selected":""}>${esc(g)}</option>`).join("")}</select></label></div>
  <div class="lbl">EXERCISES</div>${t.items.map((i,k)=>`<div class="card"><div class="rowb"><b>${esc(exName(i.exId))}</b></div><div class="row" style="margin-top:6px"><input type="number" inputmode="numeric" data-se="${k}" value="${i.sets}" aria-label="Sets" style="max-width:70px"><span class="mu" style="flex:0">×</span><input data-re="${k}" value="${esc(i.reps)}" aria-label="Reps" style="max-width:110px"><div class="mv" style="flex:0 0 auto"><button class="sm" data-u="${k}" aria-label="Move up">▲</button><button class="sm" data-d="${k}" aria-label="Move down">▼</button><button class="d" data-r="${k}" aria-label="Remove">✕</button></div></div></div>`).join("")||'<div class="mu">No exercises yet.</div>'}
  <button class="ghost w" id="tA">+ Add exercise</button>${orig?'<button class="d w" id="tX">🗑 Delete template</button>':""}`;
  b.querySelector("#tN").oninput=e=>t.name=e.target.value;b.querySelector("#tD").onchange=e=>t.dow=e.target.value===""?"":+e.target.value;b.querySelector("#tG").onchange=e=>t.group=e.target.value;
  b.querySelectorAll("[data-se]").forEach(x=>x.oninput=()=>t.items[+x.dataset.se].sets=Math.max(1,+x.value||1));
  b.querySelectorAll("[data-re]").forEach(x=>x.oninput=()=>t.items[+x.dataset.re].reps=x.value);
  b.querySelectorAll("[data-u]").forEach(x=>x.onclick=()=>{const k=+x.dataset.u;if(k>0){[t.items[k-1],t.items[k]]=[t.items[k],t.items[k-1]];draw()}});
  b.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{const k=+x.dataset.d;if(k<t.items.length-1){[t.items[k+1],t.items[k]]=[t.items[k],t.items[k+1]];draw()}});
  b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{if(confirm("Remove "+exName(t.items[+x.dataset.r].exId)+" from this template?")){t.items.splice(+x.dataset.r,1);draw()}});
  b.querySelector("#tA").onclick=()=>pickExercise(eid=>{t.items.push({exId:eid,sets:3,reps:"10"});draw()});
  if(orig)b.querySelector("#tX").onclick=()=>{if(confirm("Delete template "+t.name+"?")){tpl=tpl.filter(x=>x.id!==t.id);saveLib();s.remove();show(view)}}};
 s.querySelector("#tS").onclick=()=>{if(!t.name.trim())return alert("Enter a name");if(orig)tpl=tpl.map(x=>x.id===t.id?t:x);else tpl.push(t);saveLib();s.remove();toast("Template saved ✓");show(view)};
 draw()}

// ---- Profile (dashboard + settings) ----
let charts=[];
function chart(id,cfg){if(!window.Chart){return}cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#f2f2f7"}}},scales:{x:{ticks:{color:"#8e8e93"},grid:{color:"#2a2a2c"}},y:{ticks:{color:"#8e8e93"},grid:{color:"#2a2a2c"},beginAtZero:true}}},cfg.options||{});charts.push(new Chart(document.getElementById(id),cfg))}
const COLORS=["#2f8cff","#30d158","#ffb84f","#ff453a","#b57bff","#4fe0e0"];
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toCSV(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const rows=[["date","week","day","exercise","rehab","set","weight_kg","reps","arm_pain","knee_pain","notes"]];
 sessions.forEach(s=>{if(!s.ex.length)rows.push([s.date,s.week,s.day,"","","","","",s.armPain,s.kneePain,s.notes]);s.ex.forEach(e=>e.sets.forEach((t,i)=>rows.push([s.date,s.week,s.day,exName(e.exId,e.name),e.rehab?1:0,i+1,t.w,t.r,s.armPain,s.kneePain,s.notes])))});
 weights.forEach(w=>rows.push([w.date,weekOf(w.date),"Body weight","","","",w.kg,"","","",""]));return rows.map(r=>r.map(q).join(",")).join("\r\n")}
function renderProfile(){charts.forEach(c=>c.destroy());charts=[];
 const wk=[...Array(WEEKS)].map((_,i)=>i+1),labels=wk.map(w=>"W"+w),inW=w=>sessions.filter(s=>s.week===w);
 const groups=["Chest","Legs","Back","Shoulders/Core","Calisthenics/Balance"];
 const avg=(w,k)=>{const a=inW(w);return a.length?+(a.reduce((x,s)=>x+s[k],0)/a.length).toFixed(1):null};
 const lastW=weights.length?weights[weights.length-1].kg:START_WEIGHT,thisW=weekOf(iso(new Date()));
 const rehab=lib.filter(x=>x.rehab);
 $("#v-profile").innerHTML=`<div class="card"><div class="rowb"><div class="ico" style="width:56px;height:56px;font-size:24px">A</div><div style="flex:1"><b style="font-size:20px">Arwin</b><div class="mu">${sessions.length} workouts · ${wkLabel(thisW)}</div></div></div><div class="row" style="margin-top:10px;text-align:center"><div><b>${inW(thisW).length}</b><div class="mu">this week</div></div><div><b>${lastW} kg</b><div class="mu">body weight</div></div><div><b>${(lastW-START_WEIGHT>=0?"+":"")+(lastW-START_WEIGHT).toFixed(1)}</b><div class="mu">since start</div></div></div></div>
 ${window.Chart?"":'<div class="card mu">Charts need internet once to load.</div>'}
 <div class="lbl">DASHBOARD</div><div class="card"><b>Workouts per week</b><div style="height:200px"><canvas id="c0"></canvas></div></div>
 <div class="card"><b>Weekly volume (kg)</b><div style="height:220px"><canvas id="c1"></canvas></div></div>
 <div class="card"><b>Volume by muscle group</b><div style="height:240px"><canvas id="c2"></canvas></div></div>
 <div class="card"><b>Average pain</b><div style="height:220px"><canvas id="c3"></canvas></div></div>
 <div class="card"><b>Rehab max weight (kg)</b><div style="height:220px"><canvas id="c4"></canvas></div></div>
 <div class="lbl">DATA</div><div class="card mu">Saved on this device only. Export regularly as a backup (includes your exercises and templates).<button class="w" id="exJ">⬇️ Export JSON</button><button class="w" id="exC">⬇️ Export CSV</button><button class="w" id="imJ">⬆️ Import JSON</button><input type="file" id="imF" accept=".json,application/json" class="hid"><button class="w d" id="rst">↺ Reset to default program</button></div>
 <div class="lbl">CHANGE PIN</div><div class="card"><div class="mu">The PIN is a privacy lock only, not strong security.</div><input type="password" inputmode="numeric" id="pOld" placeholder="Current PIN" style="margin-top:8px"><input type="password" inputmode="numeric" id="pNew" placeholder="New 4-digit PIN" maxlength="4" style="margin-top:8px"><input type="password" inputmode="numeric" id="pNew2" placeholder="Repeat new PIN" maxlength="4" style="margin-top:8px"><button class="p w" id="pSave">Change PIN</button><button class="w" id="lockNow">🔒 Lock now</button></div>
 <div class="lbl">ABOUT</div><div class="card mu">Arwin's Gym Log · 183 cm · start ${START_WEIGHT} kg · 12-week plan from Mon 26 Oct 2026. Keep weights moderate; stop on sharp pain in the arm or knee.</div>`;
 chart("c0",{type:"bar",data:{labels,datasets:[{label:"Workouts",data:wk.map(w=>inW(w).length),backgroundColor:"#2f8cff"}]}});
 chart("c1",{type:"bar",data:{labels,datasets:[{label:"Total volume",data:wk.map(w=>Math.round(inW(w).reduce((a,s)=>a+vol(s),0))),backgroundColor:"#2f8cff"}]}});
 chart("c2",{type:"bar",data:{labels,datasets:groups.map((g,i)=>({label:g,backgroundColor:COLORS[i],data:wk.map(w=>Math.round(inW(w).filter(s=>s.group===g).reduce((a,s)=>a+vol(s),0)))}))},options:{scales:{x:{stacked:true,ticks:{color:"#8e8e93"}},y:{stacked:true,ticks:{color:"#8e8e93"},beginAtZero:true}}}});
 chart("c3",{type:"line",data:{labels,datasets:[{label:"Arm",data:wk.map(w=>avg(w,"armPain")),borderColor:"#ffb84f",spanGaps:true},{label:"Knee",data:wk.map(w=>avg(w,"kneePain")),borderColor:"#ff453a",spanGaps:true}]},options:{scales:{y:{min:0,max:10,ticks:{color:"#8e8e93"}},x:{ticks:{color:"#8e8e93"}}}}});
 chart("c4",{type:"line",data:{labels,datasets:rehab.map((x,i)=>({label:x.name.replace("Arm Rehab ",""),borderColor:COLORS[i%6],spanGaps:true,data:wk.map(w=>{const m=Math.max(0,...inW(w).flatMap(s=>s.ex.filter(e=>e.exId===x.id).flatMap(e=>e.sets.map(t=>t.w||0))));return m||null})}))}});
 $("#exJ").onclick=()=>download("gym-log-"+iso(new Date())+".json",JSON.stringify({app:"gym-log",version:2,sessions,weights,lib,tpl},null,2),"application/json");
 $("#exC").onclick=()=>download("gym-log-"+iso(new Date())+".csv",toCSV(),"text/csv");
 $("#imJ").onclick=()=>$("#imF").click();
 $("#imF").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sessions))throw 0;if(!confirm("Replace current data with "+d.sessions.length+" workouts from file?"))return;sessions=d.sessions;weights=Array.isArray(d.weights)?d.weights:[];if(Array.isArray(d.lib))lib=d.lib;if(Array.isArray(d.tpl))tpl=d.tpl;migrate();save();saveLib();toast("Imported ✓");renderProfile()}catch(x){alert("Not a valid Gym Log JSON file")}};
 $("#rst").onclick=()=>{if(!confirm("Reset exercises and templates to the default program? Your logged workouts are kept; custom exercises and edits are removed."))return;lib=defLib();tpl=defTpl();saveLib();toast("Program reset ✓");renderProfile()};
 $("#pSave").onclick=async()=>{const o=$("#pOld").value,n=$("#pNew").value;if((await sha(o))!==pinHash())return alert("Current PIN is wrong");if(!/^\d{4}$/.test(n))return alert("New PIN must be 4 digits");if(n!==$("#pNew2").value)return alert("New PINs don't match");localStorage.setItem("gym.pinHash",await sha(n));toast("PIN changed ✓");renderProfile()};
 $("#lockNow").onclick=()=>{sessionStorage.removeItem("gym.unlocked");$("#lock").classList.remove("hid")};
}

// ---- Measure ----
function renderMeasure(){charts.forEach(c=>c.destroy());charts=[];
 $("#v-measure").innerHTML=`<div class="lbl">BODY WEIGHT</div><div class="card"><div class="row"><input type="date" id="bwD" value="${iso(new Date())}"><input type="number" step="0.1" inputmode="decimal" id="bwK" placeholder="kg"><button class="p" id="bwAdd" style="flex:0 0 auto">Add</button></div><div style="height:240px;margin-top:10px"><canvas id="c5"></canvas></div><table id="bwT"></table></div>`;
 const bw=[{date:iso(START)+" (start)",kg:START_WEIGHT},...weights];
 chart("c5",{type:"line",data:{labels:bw.map(x=>x.date.slice(5)),datasets:[{label:"kg",data:bw.map(x=>x.kg),borderColor:"#30d158"}]},options:{scales:{y:{beginAtZero:false,ticks:{color:"#8e8e93"}},x:{ticks:{color:"#8e8e93"}}}}});
 $("#bwT").innerHTML=[...weights].reverse().map(x=>`<tr><td>${dmy(x.date)}</td><td>${x.kg} kg</td><td><button class="d" data-bw="${x.date}">✕</button></td></tr>`).join("");
 $("#bwAdd").onclick=()=>{const kg=parseFloat($("#bwK").value),d=$("#bwD").value;if(!kg||!d)return;weights=weights.filter(x=>x.date!==d);weights.push({date:d,kg});weights.sort((a,b)=>a.date.localeCompare(b.date));save();renderMeasure()};
 $("#bwT").querySelectorAll("[data-bw]").forEach(b=>b.onclick=()=>{weights=weights.filter(x=>x.date!==b.dataset.bw);save();renderMeasure()});
}

// ---- PWA manifest (inline) ----
(function(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#000"/><text x="256" y="330" font-size="280" text-anchor="middle">🏋️</text></svg>`;
 const icon="data:image/svg+xml,"+encodeURIComponent(svg);const base=location.href.replace(/[#?].*$/,"");
 const m={name:"Arwin's Gym Log",short_name:"Gym Log",start_url:base,scope:base.replace(/[^/]*$/,""),display:"standalone",background_color:"#000000",theme_color:"#000000",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
 $("#mf").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));$("#ati").href=icon})();

restDur=LS.get("gym.rest",90);
buildPad();
if(sessionStorage.getItem("gym.unlocked")==="1")$("#lock").classList.add("hid");
if(!window.isSecureContext||!crypto.subtle){$("#pinErr").textContent="PIN check unavailable on this connection; app unlocked.";$("#lock").classList.add("hid")}
tick=setInterval(tickFn,1000);
show("workout");
if(active)renderActive();
</script></body></html>
