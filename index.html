const STEPS={
"chest-press-machine":["Set the seat so the handles line up with the middle of your chest.","Sit tall with your back and head against the pad, feet flat on the floor.","Grip the handles, shoulders down and back, elbows slightly below shoulder height.","Breathe out and press the handles forward until your arms are nearly straight — don't lock the elbows.","Pause briefly, then let the handles return slowly (about 2–3 seconds) until you feel a light chest stretch."],
"incline-db-press":["Set the bench to about 30° and sit with a dumbbell on each thigh.","Lie back, kicking the dumbbells up to your chest, feet flat on the floor.","Hold the dumbbells beside your upper chest, elbows about 45° from your body.","Press both dumbbells up and slightly together over your upper chest until arms are nearly straight.","Lower slowly back to the start, keeping your shoulder blades pinned to the bench."],
"pec-deck-cable-fly":["Adjust the seat so the handles are at chest height.","Sit tall with your back on the pad and grip the handles with a slight bend in the elbows.","Keeping that elbow bend fixed, squeeze your chest to bring the handles together in front of you.","Pause and squeeze for a second at the middle.","Open back out slowly until you feel a comfortable stretch — don't let your arms go behind your body."],
"arm-rehab-band-tricep-pushdown":["Anchor a light band above head height.","Stand facing the anchor, holding the band with elbows tucked at your sides and bent to about 90°.","Keep your upper arms still and push your hands down until your arms are straight.","Squeeze the back of the arm briefly at the bottom.","Let your hands rise slowly back to the start. Use light tension and stop on any sharp pain."],
"arm-rehab-wrist-curl-1-2kg":["Sit on a bench and rest your forearm on your thigh, palm facing up, wrist just past the knee.","Hold a 1–2 kg dumbbell and let the wrist bend down gently.","Curl the wrist up slowly, lifting the weight with your hand only.","Pause at the top for a second.","Lower slowly over 3 seconds. Keep it pain-free and stop on any sharp pain."],
"goblet-squat":["Hold one dumbbell vertically against your chest with both hands.","Stand with feet shoulder width apart, toes turned out slightly.","Brace your core and sit your hips back and down, keeping your chest up.","Go only as deep as your knee stays pain-free; knees track over your toes.","Push through your whole foot to stand back up tall, squeezing your glutes at the top."],
"leg-press":["Sit back in the machine with your back and hips flat against the pad.","Place your feet shoulder width apart in the middle of the platform.","Release the safety handles and hold the side grips.","Lower the platform slowly by bending your knees, only as far as is pain-free for your knee and your lower back stays on the pad.","Push through your heels to extend your legs, stopping just short of locking your knees.","Re-engage the safety handles when you finish your set."],
"romanian-deadlift":["Stand tall holding the bar (or dumbbells) at your thighs, feet hip width apart.","Soften your knees slightly and keep them there.","Push your hips back, sliding the weight down your thighs with a flat back.","Lower until you feel a strong hamstring stretch, usually just below the knee.","Drive your hips forward to stand back up, squeezing your glutes at the top."],

"calf-raise":["Step under the shoulder pads and place the balls of your feet on the edge of the platform.","Stand tall with knees straight but not locked.","Let your heels drop slowly below the platform for a stretch.","Rise up as high as you can onto your toes.","Pause at the top for a second, then lower slowly."],
"lat-pulldown":["Adjust the thigh pad so your legs are locked in firmly.","Grip the bar a little wider than shoulder width, palms facing away.","Sit with a slight lean back and your chest up.","Pull the bar down to your upper chest by driving your elbows down toward your ribs.","Squeeze your back, then let the bar rise slowly until your arms are straight."],
"seated-cable-row":["Sit with your feet on the foot plate and knees slightly bent.","Grab the handle and sit up tall, arms straight, chest up.","Pull the handle to your stomach, driving your elbows back close to your body.","Squeeze your shoulder blades together for a second.","Let your arms extend slowly forward without rounding your back."],
"chest-supported-row":["Set an incline bench to about 45° and lie chest-down on it.","Let a dumbbell hang straight down in each hand, palms facing in.","Pull both dumbbells up toward your lower ribs, elbows going back.","Squeeze your shoulder blades together at the top.","Lower slowly until your arms are straight again."],
"arm-rehab-band-bicep-curl":["Stand on the middle of a light band, holding the ends with palms facing forward.","Keep your elbows tucked at your sides.","Curl your hands up toward your shoulders slowly.","Pause briefly at the top.","Lower slowly over 3 seconds. Keep it light and stop on any sharp pain."],
"arm-rehab-reverse-wrist-curl":["Sit and rest your forearm on your thigh, palm facing down, wrist just past the knee.","Hold a very light dumbbell and let the knuckles drop gently.","Lift the back of the hand up slowly using only the wrist.","Pause at the top for a second.","Lower slowly. Keep it pain-free and stop on any sharp pain."],
"shoulder-press-machine":["Set the seat so the handles start at about shoulder height.","Sit tall with your back against the pad and feet flat.","Grip the handles with your elbows below your hands.","Press up until your arms are nearly straight overhead, without arching your back.","Lower slowly back to shoulder height."],

 $("#v-profile").innerHTML=`<div class="card"><div class="rowb"><div class="ico" style="width:56px;height:56px;font-size:24px">A</div><div style="flex:1"><b style="font-size:20px">Arwin</b><div class="mu">${sessions.length} workouts · ${wkLabel(thisW)}</div></div></div><div class="row" style="margin-top:10px;text-align:center"><div><b>${inW(thisW).length}</b><div class="mu">this week</div></div><div><b>${lastW} kg</b><div class="mu">body weight</div></div><div><b>${(lastW-START_WEIGHT>=0?"+":"")+(lastW-START_WEIGHT).toFixed(1)}</b><div class="mu">since start</div></div></div></div>
 ${window.Chart?"":'<div class="card mu">Charts need internet once to load.</div>'}
 <div class="lbl">DASHBOARD</div><div class="card"><b>Workouts per week</b><div style="height:200px"><canvas id="c0"></canvas></div></div>
 <div class="card"><b>Weekly volume (kg)</b><div style="height:220px"><canvas id="c1"></canvas></div></div>
 <div class="card"><b>Volume by muscle group</b><div style="height:240px"><canvas id="c2"></canvas></div></div>
 <div class="card"><b>Average pain</b><div style="height:220px"><canvas id="c3"></canvas></div></div>
 <div class="card"><b>Rehab max weight (kg)</b><div style="height:220px"><canvas id="c4"></canvas></div></div>
 <div class="lbl">DATA</div><div class="card mu">Saved on this device only. Export regularly as a backup (includes your exercises, templates and machine photos).<button class="w" id="exJ">⬇️ Export JSON</button><button class="w" id="exC">⬇️ Export CSV</button><button class="w" id="imJ">⬆️ Import JSON</button><input type="file" id="imF" accept=".json,application/json" class="hid"><button class="w d" id="rst">↺ Reset to default program</button></div>
 <div class="lbl">SETTINGS</div><div class="card"><b>Rest-end sound</b><div class="seg" id="sndSeg" style="margin-top:8px">${[["buzz","Buzz"],["beep","Beep"],["off","Off"]].map(([k,n])=>`<button data-snd="${k}" class="${restSound===k?"on":""}">${n}</button>`).join("")}</div><button class="w" id="sndTest">🔊 Test sound</button><label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="askC" ${LS.get("gym.askCoach",true)?"checked":""} style="width:24px;min-height:24px"> Ask to send to Coach after each workout</label><label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="phT" ${phoneT?"checked":""} style="width:24px;min-height:24px"> Phone timer alert (iPhone Shortcut “Gym Rest” starts a Clock timer when rest starts)</label><button class="w" id="phHelp">How to set up the phone timer</button><div style="margin-top:12px"><b>Lock-screen notification</b><div class="mu" id="pushSt" style="margin:4px 0"></div><button class="w" id="pushBtn"></button></div><div class="mu" style="margin-top:8px">iPhone: Safari can't vibrate, so Buzz plays a loud buzz sound instead. Keep the volume up; it plays even with the silent switch on.</div></div>
 <div class="lbl">CHANGE PIN</div><div class="card"><div class="mu">The PIN is a privacy lock only, not strong security.</div><input type="password" inputmode="numeric" id="pOld" placeholder="Current PIN" style="margin-top:8px"><input type="password" inputmode="numeric" id="pNew" placeholder="New 4-digit PIN" maxlength="4" style="margin-top:8px"><input type="password" inputmode="numeric" id="pNew2" placeholder="Repeat new PIN" maxlength="4" style="margin-top:8px"><button class="p w" id="pSave">Change PIN</button><button class="w" id="lockNow">🔒 Lock now</button></div>
 <div class="lbl">ABOUT</div><div class="card mu">Arwin's Gym Log · 183 cm · start ${START_WEIGHT} kg · 12-week plan from Mon 26 Oct 2026. Keep weights moderate; stop on sharp pain in the arm or knee.</div>`;
 chart("c0",{type:"bar",data:{labels,datasets:[{label:"Workouts",data:wk.map(w=>inW(w).length),backgroundColor:"#2f8cff"}]}});
 chart("c1",{type:"bar",data:{labels,datasets:[{label:"Total volume",data:wk.map(w=>Math.round(inW(w).reduce((a,s)=>a+vol(s),0))),backgroundColor:"#2f8cff"}]}});
 chart("c2",{type:"bar",data:{labels,datasets:groups.map((g,i)=>({label:g,backgroundColor:COLORS[i],data:wk.map(w=>Math.round(inW(w).filter(s=>s.group===g).reduce((a,s)=>a+vol(s),0)))}))},options:{scales:{x:{stacked:true,ticks:{color:"#8e8e93"}},y:{stacked:true,ticks:{color:"#8e8e93"},beginAtZero:true}}}});
 chart("c3",{type:"line",data:{labels,datasets:[{label:"Arm",data:wk.map(w=>avg(w,"armPain")),borderColor:"#ffb84f",spanGaps:true},{label:"Knee",data:wk.map(w=>avg(w,"kneePain")),borderColor:"#ff453a",spanGaps:true}]},options:{scales:{y:{min:0,max:10,ticks:{color:"#8e8e93"}},x:{ticks:{color:"#8e8e93"}}}}});
 chart("c4",{type:"line",data:{labels,datasets:rehab.map((x,i)=>({label:x.name.replace("Arm Rehab ",""),borderColor:COLORS[i%6],spanGaps:true,data:wk.map(w=>{const m=Math.max(0,...inW(w).flatMap(s=>s.ex.filter(e=>e.exId===x.id).flatMap(e=>e.sets.map(t=>t.w||0))));return m||null})}))}});
 $("#exJ").onclick=async()=>{let photos=[];try{photos=await allPhotos()}catch(e){}download("gym-log-"+iso(new Date())+".json",JSON.stringify({app:"gym-log",version:3,sessions,weights,lib,tpl,photos},null,2),"application/json")};
 document.querySelectorAll("#sndSeg [data-snd]").forEach(b=>b.onclick=()=>{restSound=b.dataset.snd;if(restSound==="buzz")vibNote();LS.set("gym.sound",restSound);document.querySelectorAll("#sndSeg [data-snd]").forEach(x=>x.classList.toggle("on",x===b))});
 $("#askC").onchange=e=>LS.set("gym.askCoach",e.target.checked);
 $("#phT").onchange=e=>{phoneT=e.target.checked;LS.set("gym.phoneT",phoneT);const r=$("#rest");if(r)r.innerHTML="";if(phoneT&&!LS.get("gym.phHelpSeen",false)){LS.set("gym.phHelpSeen",true);phoneHelp()}};$("#phHelp").onclick=phoneHelp;
 const pst=()=>{$("#pushSt").textContent=!PUSH_API?"Coming soon: the notification server isn't set up yet.":pushOn?"On ✓ — you'll get a notification when rest ends, even with the app closed or phone locked.":/iPhone|iPad/.test(navigator.userAgent)&&!isStandalone()?"Needs the Home Screen app: Share → Add to Home Screen, then open Gym Log from the icon.":"Off. Sends a notification when rest ends, even in the background (iOS 16.4+ Home Screen app).";$("#pushBtn").textContent=pushOn?"Turn off notifications":"🔔 Turn on notifications";$("#pushBtn").disabled=!PUSH_API};pst();
 $("#pushBtn").onclick=async()=>{if(pushOn){pushOff();pst();return}try{await pushEnable();toast("Notifications on ✓ (test sent)")}catch(e){pushOn=false;LS.set("gym.pushOn",false);alert(e.message)}pst()};
 $("#sndTest").onclick=()=>{unlockAudio();vibNote();playTones(restSound==="beep"?"beep":"buzz")};
 $("#exC").onclick=()=>download("gym-log-"+iso(new Date())+".csv",toCSV(),"text/csv");
 $("#imJ").onclick=()=>$("#imF").click();
 $("#imF").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sessions))throw 0;if(!confirm("Replace current data with "+d.sessions.length+" workouts from file?"))return;sessions=d.sessions;weights=Array.isArray(d.weights)?d.weights:[];if(Array.isArray(d.lib))lib=d.lib;if(Array.isArray(d.tpl))tpl=d.tpl;if(Array.isArray(d.photos))for(const p of d.photos)await putPhoto(p);migrate();save();saveLib();toast("Imported ✓");renderProfile()}catch(x){alert("Not a valid Gym Log JSON file")}};
 $("#rst").onclick=()=>{if(!confirm("Reset exercises and templates to the default program? Your logged workouts are kept; custom exercises and edits are removed."))return;lib=defLib();tpl=defTpl();saveLib();toast("Program reset ✓");renderProfile()};
 $("#pSave").onclick=async()=>{const o=$("#pOld").value,n=$("#pNew").value;if((await sha(o))!==pinHash())return alert("Current PIN is wrong");if(!/^\d{4}$/.test(n))return alert("New PIN must be 4 digits");if(n!==$("#pNew2").value)return alert("New PINs don't match");localStorage.setItem("gym.pinHash",await sha(n));toast("PIN changed ✓");renderProfile();setTimeout(()=>alert("Coach tips use your old PIN until Sarah updates them."),50)};
 $("#lockNow").onclick=()=>{sessionStorage.removeItem("gym.unlocked");$("#lock").classList.remove("hid")};
}

// ---- Measure ----
function renderMeasure(){charts.forEach(c=>c.destroy());charts=[];
 $("#v-measure").innerHTML=`<div class="lbl">BODY WEIGHT</div><div class="card"><div class="row"><input type="date" id="bwD" value="${iso(new Date())}"><input type="number" step="0.1" inputmode="decimal" id="bwK" placeholder="kg"><button class="p" id="bwAdd" style="flex:0 0 auto">Add</button></div><div style="height:240px;margin-top:10px"><canvas id="c5"></canvas></div><table id="bwT"></table></div>`;
 const bw=[{date:iso(START)+" (start)",kg:START_WEIGHT},...weights];
 chart("c5",{type:"line",data:{labels:bw.map(x=>x.date.slice(5)),datasets:[{label:"kg",data:bw.map(x=>x.kg),borderColor:"#30d158"}]},options:{scales:{y:{beginAtZero:false,ticks:{color:"#8e8e93"}},x:{ticks:{color:"#8e8e93"}}}}});
 $("#bwT").innerHTML=[...weights].reverse().map(x=>`<tr><td>${dmy(x.date)}</td><td>${x.kg} kg</td><td><button class="d" data-bw="${x.date}">✕</button></td></tr>`).join("");
 $("#bwAdd").onclick=()=>{const kg=parseFloat($("#bwK").value),d=$("#bwD").value;if(!kg||!d)return;weights=weights.filter(x=>x.date!==d);weights.push({date:d,kg});weights.sort((a,b)=>a.date.localeCompare(b.date));save();renderMeasure()};
 $("#bwT").querySelectorAll("[data-bw]").forEach(b=>b.onclick=()=>{weights=weights.filter(x=>x.date!==b.dataset.bw);save();renderMeasure()});
}

// ---- Web Push: lock-screen notification when rest ends (server schedules it; see gym-push worker) ----
const PUSH_API="",VAPID_PUB="BBK5wW67JXkDm6iKC3laXBiaICi3j4GOiWVw58sXVw06G4P4O6coV6-ihSGszyrKv5JSVyIDJc4vLnWzDuUkcXc";
let pushOn=LS.get("gym.pushOn",false),pushLast=0;
const pushDev=()=>{let d=LS.get("gym.pushId","");if(!d){d=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");LS.set("gym.pushId",d)}return d};
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushOK=()=>"serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window;
function pushPost(path,j){if(!PUSH_API)return Promise.reject(new Error("no server"));return fetch(PUSH_API.replace(/\/$/,"")+"/"+path,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({id:pushDev(),...j})})}
function pushSync(){if(!pushOn||!PUSH_API)return;const now=Date.now(),t=active&&restEnd>now?restEnd:0;if(t===pushLast)return;
 const sub=LS.get("gym.pushSub",null);if(t&&sub)pushPost("schedule",{sub,at:t}).catch(()=>{});else if(!t&&pushLast>now+1000)pushPost("cancel",{}).catch(()=>{});pushLast=t}
async function pushEnable(){if(!pushOK())throw new Error(/iPhone|iPad/.test(navigator.userAgent)&&!isStandalone()?"Add Gym Log to your Home Screen first, then open it from there.":"This browser doesn't support push notifications.");
 if(!PUSH_API)throw new Error("Notification server isn't set up yet.");
 const reg=await navigator.serviceWorker.register("sw.js",{scope:"./"});await navigator.serviceWorker.ready;
 const perm=await Notification.requestPermission();if(perm!=="granted")throw new Error("Notifications not allowed. iPhone: Settings → Notifications → Gym Log → Allow.");
 const k=Uint8Array.from(atob(VAPID_PUB.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
 const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:k});
 LS.set("gym.pushSub",sub.toJSON());pushOn=true;LS.set("gym.pushOn",true);pushLast=0;const r=await pushPost("test",{sub:sub.toJSON()});if(!r.ok)throw new Error("Server test failed ("+r.status+")")}
function pushOff(){if(pushLast>Date.now())pushPost("cancel",{}).catch(()=>{});pushOn=false;LS.set("gym.pushOn",false);pushLast=0}
if(pushOn&&pushOK())navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});

restDur=LS.get("gym.rest",90);
buildPad();
if(sessionStorage.getItem("gym.unlocked")==="1")$("#lock").classList.add("hid");
if(!window.isSecureContext||!crypto.subtle){$("#pinErr").textContent="PIN check unavailable on this connection; app unlocked.";$("#lock").classList.add("hid")}
tick=setInterval(()=>{tickFn();pushSync()},250);
show("workout");loadTips().then(()=>{if(active&&!$("#aw").classList.contains("hid"))renderActive()});
if(active)renderActive();
</script></body></html>
